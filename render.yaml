# Render Blueprint — ONE web service only.
# Do NOT create another Web Service in the Dashboard (new name = new *.onrender.com URL).
# Keep using this service; set WEBAPP_URL = Primary URL of THIS service, then Manual Deploy.
# Suspend/delete any older copies (telegram-1000, telegram-1000-1, workers).
services:
  - type: web
    name: telegram-1000-web
    runtime: python
    plan: free
    branch: master
    buildCommand: bash scripts/render-build.sh
    startCommand: python -m server.main
    healthCheckPath: /api/health
    envVars:
      - key: DEV_MODE
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: BOT_CLIENT_ID
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
