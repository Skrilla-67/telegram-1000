# Render Blueprint for Dice 1000
# https://render.com/docs/blueprint-spec
# Bot polling runs inside the web service (no Background Worker needed).
services:
  - type: web
    name: telegram-1000-web
    runtime: python
    plan: free
    branch: master
    buildCommand: bash scripts/render-build.sh
    startCommand: python -m server.main
    healthCheckPath: /api/health
    envVars:
      - key: DEV_MODE
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: BOT_CLIENT_ID
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
