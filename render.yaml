# Render Blueprint for Кости 1000
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: telegram-1000-web
    runtime: python
    plan: free
    branch: cursor/dice-1000-mini-app
    buildCommand: |
      pip install -r requirements.txt
      cd web && npm install && npm run build
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DEV_MODE
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  - type: worker
    name: telegram-1000-bot
    runtime: python
    plan: free
    branch: cursor/dice-1000-mini-app
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DEV_MODE
        value: "false"
